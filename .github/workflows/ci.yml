name: CI

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main pushes and same-repository PRs run on Buildkite's protected Janus pipeline.
# Hosted CI remains available for fork PRs and explicit rollback dispatches.
# Review fork workflow changes before approving: routing is not a runner access boundary.
jobs:
  build-and-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caldotcom-api-v2-sdk-dist
          path: packages/sdk/dist
          if-no-files-found: error
