name: Publish Package

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version to publish (for dry run workflows)'
        required: false

permissions:
  contents: read

jobs:
  # Keep the original path until the documented native commissioning gates pass.
  prepare-janus:
    name: Prepare Janus package
    if: >-
      github.repository == 'aditzel/caldotcom-api-v2-sdk' &&
      contains(fromJSON('["verify","publish"]'), vars.JANUS_CAL_RELEASE_MODE)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate preparation mode
        env:
          RELEASE_MODE: ${{ vars.JANUS_CAL_RELEASE_MODE }}
        run: |
          case "$RELEASE_MODE" in
            verify|publish) ;;
            *) echo "Invalid JANUS_CAL_RELEASE_MODE" >&2; exit 1 ;;
          esac
      - name: Checkout reviewed release helpers
        id: helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MiraiForge/devops
          ref: 3ff6ff730c9607546551e11f9ae271ce0235487a
          token: ${{ secrets.JANUS_HELPERS_READ_TOKEN }}
          path: .janus-tools
          persist-credentials: false
      - name: Prepare authenticated Janus package
        id: handoff
        env:
          JANUS_CAL_RELEASE_MODE: ${{ vars.JANUS_CAL_RELEASE_MODE }}
          JANUS_CAL_RELEASE_POLICY: ${{ vars.JANUS_CAL_RELEASE_POLICY }}
          JANUS_GITHUB_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JANUS_BUILDKITE_READ_TOKEN: ${{ secrets.BUILDKITE_CAL_RELEASE_READ_TOKEN }}
          JANUS_BUILDKITE_CREATE_TOKEN: ${{ secrets.BUILDKITE_CAL_RELEASE_CREATE_TOKEN }}
        run: python3 -I -B .janus-tools/infrastructure/buildkite-publishers/cal-workflow.py prepare
      - name: Upload authenticated handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.handoff.outputs.artifact-name }}
          path: ${{ steps.handoff.outputs.handoff-file }}
          if-no-files-found: error
          overwrite: false
      - name: Remove private coordinator files
        if: always() && steps.helpers.outcome == 'success'
        run: python3 -I -B .janus-tools/infrastructure/buildkite-publishers/cal-workflow.py cleanup

  publish:
    name: Publish to npm
    needs: prepare-janus
    if: >-
      !cancelled() && github.repository == 'aditzel/caldotcom-api-v2-sdk' &&
      (needs.prepare-janus.result == 'success' ||
       !contains(fromJSON('["verify","publish"]'), vars.JANUS_CAL_RELEASE_MODE))
    runs-on: ${{ fromJSON(vars.JANUS_CAL_RELEASE_MODE == '' && '["self-hosted","Linux","X64"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate release mode
        env:
          RELEASE_MODE: ${{ vars.JANUS_CAL_RELEASE_MODE }}
        run: |
          case "$RELEASE_MODE" in
            ''|verify|publish) ;;
            *) echo "Invalid JANUS_CAL_RELEASE_MODE" >&2; exit 1 ;;
          esac
      - name: Checkout repository
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        uses: actions/checkout@v4

      - name: Set up Bun
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        run: bun install --frozen-lockfile

      - name: Lint
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        run: bun run lint

      - name: Build
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        run: bun run build

      - name: Test
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        run: bun test

      - name: Setup Node.js
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        run: npm install -g npm@latest

      - name: Publish to NPM
        if: vars.JANUS_CAL_RELEASE_MODE == ''
        working-directory: packages/sdk
        run: npm publish --provenance --access public
      - name: Checkout reviewed release helpers
        id: helpers
        if: vars.JANUS_CAL_RELEASE_MODE != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MiraiForge/devops
          ref: 3ff6ff730c9607546551e11f9ae271ce0235487a
          token: ${{ secrets.JANUS_HELPERS_READ_TOKEN }}
          path: .janus-tools
          persist-credentials: false
      - name: Setup hosted publisher Node
        if: vars.JANUS_CAL_RELEASE_MODE != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Publish authenticated package
        if: vars.JANUS_CAL_RELEASE_MODE != ''
        env:
          JANUS_CAL_RELEASE_MODE: ${{ vars.JANUS_CAL_RELEASE_MODE }}
          JANUS_CAL_RELEASE_POLICY: ${{ vars.JANUS_CAL_RELEASE_POLICY }}
          JANUS_GITHUB_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JANUS_BUILDKITE_READ_TOKEN: ${{ secrets.BUILDKITE_CAL_RELEASE_READ_TOKEN }}
        run: python3 -I -B .janus-tools/infrastructure/buildkite-publishers/cal-workflow.py publish
      - name: Remove private publisher files
        if: always() && steps.helpers.outcome == 'success'
        run: python3 -I -B .janus-tools/infrastructure/buildkite-publishers/cal-workflow.py cleanup
